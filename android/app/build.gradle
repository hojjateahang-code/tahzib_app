plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tahzib.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tahzib.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // تعریف آدرس فایل‌های محلی برنامک در نسخه APK اندروید (کاملاً مستقل و تحت پروتکل امن appassets)
        buildConfigField "String", "SERVER_URL", "\"https://appassets.androidplatform.net/index.html\""
        // تعریف آدرس سرور اصلی اینترنتی پایگاه داده جهت همگام‌سازی ابری و دیتابیس آنلاین
        buildConfigField "String", "REMOTE_SERVER_URL", "\"https://ais-pre-ef5fjznqypc7c7a4bgzzpu-584824184963.us-west2.run.app\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.9.0'
}
